name: Build iOS packages

on:
  workflow_dispatch:
  push:
    branches: ["codex/ios16-media-bridge"]
  pull_request:

jobs:
  theos:
    runs-on: macos-15
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        scheme: [rootful, rootless]
    steps:
      - uses: actions/checkout@v4
      - name: Install Theos
        env:
          THEOS: ${{ runner.temp }}/theos
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          brew untap aws/tap || true
          brew install ldid xz
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          for attempt in 1 2 3 4; do
            if "$THEOS/bin/install-sdk" latest; then
              break
            fi
            if [[ "$attempt" == 4 ]]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done
      - name: Build package
        env:
          THEOS: ${{ runner.temp }}/theos
        run: |
          ./scripts/build-ffmpeg-ios.sh
          if [[ "${{ matrix.scheme }}" == "rootless" ]]; then
            make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          else
            make clean package FINALPACKAGE=1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: vcam-${{ matrix.scheme }}
          path: packages/*.deb

  roothide:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install RootHide Theos
        env:
          THEOS: ${{ runner.temp }}/theos-roothide
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          brew untap aws/tap || true
          brew install ldid xz
          git clone --recursive https://github.com/roothide/theos.git "$THEOS"
          for attempt in 1 2 3 4; do
            if "$THEOS/bin/install-sdk" latest; then
              break
            fi
            if [[ "$attempt" == 4 ]]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done
      - name: Build roothide package
        env:
          THEOS: ${{ runner.temp }}/theos-roothide
        run: |
          ./scripts/build-ffmpeg-ios.sh
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide
      - uses: actions/upload-artifact@v4
        with:
          name: vcam-roothide
          path: packages/*.deb

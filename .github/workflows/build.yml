name: Build rootless package

on:
  workflow_dispatch:
  push:
    branches: ["codex/ios18-adapt"]
  pull_request:

jobs:
  rootless:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run host regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Install Theos
        env:
          THEOS: ${{ runner.temp }}/theos-rootless
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          brew untap aws/tap || true
          brew install ldid xz
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          for attempt in 1 2 3 4; do
            if "$THEOS/bin/install-sdk" latest; then
              break
            fi
            if [[ "$attempt" == 4 ]]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done
      - name: Build rootless package
        env:
          THEOS: ${{ runner.temp }}/theos-rootless
        run: |
          ./scripts/build-ffmpeg-ios.sh
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
      - name: Build iOS 18 probe dylib (no-substrate)
        run: |
          xcrun -sdk iphoneos clang -arch arm64e -mios-version-min=18.0 -dynamiclib \
            probe/vcam-ios18-probe.m \
            -o vcam-ios18-probe.dylib \
            -framework Foundation -framework CoreMedia -framework CoreVideo
          echo '=== probe sections ==='
          otool -l vcam-ios18-probe.dylib | grep -E 'sectname|segname' || true
          echo '=== probe symbols ==='
          nm -gU vcam-ios18-probe.dylib | grep -iE 'ctor|probe|VCAMProbe' || true
          xcrun -sdk iphoneos clang -arch arm64 -mios-version-min=18.0 \
            probe/vcam_frame_listener.m \
            -o vcam_frame_listener
          ldid -S vcam_frame_listener
          ldid -S vcam-ios18-probe.dylib
          lipo -info vcam-ios18-probe.dylib
          lipo -info vcam_frame_listener
          file vcam-ios18-probe.dylib
      - name: Validate rootless release shape
        run: |
          set -euo pipefail
          deb_count="$(find packages -maxdepth 1 -type f -name '*.deb' -print | wc -l | tr -d ' ')"
          test "$deb_count" -eq 1
          deb="$(find packages -maxdepth 1 -type f -name '*.deb' -print)"
          [[ "$deb" == *"_iphoneos-arm64.deb" ]]
          media_client="$(find .theos/_ -type f -name VCAMMediaServerClient.dylib -print -quit)"
          springboard_client="$(find .theos/_ -type f -name VCAMSpringBoardClient.dylib -print -quit)"
          worker="$(find .theos/_ -type f -name vcamd -print -quit)"
          injection_monitor="$(find .theos/_ -type f -name vcaminjectd -print -quit)"
          test -n "$media_client"
          test -n "$springboard_client"
          test -n "$worker"
          test -n "$injection_monitor"
          lipo -info "$media_client"
          lipo -info "$springboard_client"
          lipo -info "$worker"
          lipo -info "$injection_monitor"
          lipo "$media_client" -verify_arch arm64 arm64e
          lipo "$springboard_client" -verify_arch arm64 arm64e
          lipo "$worker" -verify_arch arm64
          lipo "$injection_monitor" -verify_arch arm64
          lipo "$springboard_client" -thin arm64e -output /tmp/VCAMSpringBoardClient-arm64e.dylib
          otool -l /tmp/VCAMSpringBoardClient-arm64e.dylib | grep -q 'sectname __objc_stubs'
          otool -l /tmp/VCAMSpringBoardClient-arm64e.dylib | grep -q 'sectname __objc_intobj'
          ldid -e "$worker" > /tmp/vcamd-entitlements.plist
          /usr/libexec/PlistBuddy -c 'Print :com.apple.private.memorystatus' /tmp/vcamd-entitlements.plist | grep -qx true
          obsolete_count="$(find .theos/_ -type f \( -name VCAM.dylib -o -name VCAMAppClient.dylib -o -name VCAMWebKitClient.dylib \) -print | wc -l | tr -d ' ')"
          test "$obsolete_count" -eq 0
          grep -q '"/usr/libexec/cameracaptured"' Sources/Daemon/VCAMInjectionMonitor.m
          ! grep -q '"/System/Library/CoreServices/SpringBoard.app/SpringBoard"' Sources/Daemon/VCAMInjectionMonitor.m
          test "$(grep -c '^            \.processPath = ' Sources/Daemon/VCAMInjectionMonitor.m)" -eq 1
          test "$(grep -c '^            \.dylibPath = ' Sources/Daemon/VCAMInjectionMonitor.m)" -eq 1
          ! grep -q '\.processPath = "/Applications/' Sources/Daemon/VCAMInjectionMonitor.m
      - uses: actions/upload-artifact@v4
        with:
          name: vcam-rootless
          path: packages/*.deb
          retention-days: 7

      - name: Build native probe app (separate deb, not the product package)
        env:
          THEOS: ${{ runner.temp }}/theos-rootless
        run: |
          set -euo pipefail
          make -C probe-app clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          probe_debs="$(find probe-app/packages -maxdepth 1 -type f -name '*_iphoneos-arm64.deb' -print | wc -l | tr -d ' ')"
          test "$probe_debs" -eq 1
          probe_app="$(find probe-app/.theos/_ -type f -name VCAMDetectProbe -path '*/Applications/*' -print -quit)"
          test -n "$probe_app"
          # bundle 缺 Info.plist 时 LaunchServices 不认该 App（真机 uiopen 静默失败已实测）
          probe_plist="$(find probe-app/.theos/_ -type f -name Info.plist -path '*/VCAMDetectProbe.app/*' -print -quit)"
          test -n "$probe_plist"
          lipo -info "$probe_app"
          lipo "$probe_app" -verify_arch arm64 arm64e
      - uses: actions/upload-artifact@v4
        with:
          name: vcam-detect-probe
          path: probe-app/packages/*.deb
          retention-days: 7

      # 标准容器变体：同一 arm64e 二进制仅换 identity（bundleID/scheme vcam-probe2），
      # 产出未签名 ipa 供 Sideloadly 真签名安装——K 轮已证标准通道出帧，
      # 此变体用于在标准容器补跑 native_probe 原生管线对照。
      - name: Build std-container probe ipa (Sideloadly payload)
        env:
          THEOS: ${{ runner.temp }}/theos-rootless
        run: |
          set -euo pipefail
          plist="$(find probe-app/.theos/_ -type f -name Info.plist -path '*/VCAMDetectProbe.app/*' -print -quit)"
          appdir="$(dirname "$plist")"
          test -n "$appdir"
          rm -rf std-build && mkdir -p std-build/Payload
          cp -R "$appdir" std-build/Payload/VCAMDetectProbe.app
          python3 - <<'PYEOF'
          import plistlib
          p = "std-build/Payload/VCAMDetectProbe.app/Info.plist"
          d = plistlib.load(open(p, "rb"))
          d["CFBundleIdentifier"] = "com.codex.vcamdetectprobe.std"
          d["CFBundleName"] = "VCAM Probe Std"
          d["CFBundleDisplayName"] = "VCAM Probe Std"
          for e in d.get("CFBundleURLTypes", []):
              e["CFBundleURLName"] = "com.codex.vcamdetectprobe.std"
              e["CFBundleURLSchemes"] = ["vcam-probe2"]
          plistlib.dump(d, open(p, "wb"))
          PYEOF
          (cd std-build && zip -qry ../vcam-probe-std.ipa Payload)
          test -s vcam-probe-std.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: vcam-probe-std-ipa
          path: vcam-probe-std.ipa
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: vcam-ios18-probe
          path: |
            vcam-ios18-probe.dylib
            vcam_frame_listener
          retention-days: 7

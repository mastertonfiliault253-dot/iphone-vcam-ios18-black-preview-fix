name: Build rootless package

on:
  workflow_dispatch:
  push:
    branches: ["codex/ios16-media-bridge"]
  pull_request:

jobs:
  rootless:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run host regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Install Theos
        env:
          THEOS: ${{ runner.temp }}/theos-rootless
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          brew untap aws/tap || true
          brew install ldid xz
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          for attempt in 1 2 3 4; do
            if "$THEOS/bin/install-sdk" latest; then
              break
            fi
            if [[ "$attempt" == 4 ]]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done
      - name: Build rootless package
        env:
          THEOS: ${{ runner.temp }}/theos-rootless
        run: |
          ./scripts/build-ffmpeg-ios.sh
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
      - name: Validate rootless release shape
        run: |
          set -euo pipefail
          deb_count="$(find packages -maxdepth 1 -type f -name '*.deb' -print | wc -l | tr -d ' ')"
          test "$deb_count" -eq 1
          deb="$(find packages -maxdepth 1 -type f -name '*.deb' -print)"
          [[ "$deb" == *"_iphoneos-arm64.deb" ]]
          media_client="$(find .theos/_ -type f -name VCAMMediaServerClient.dylib -print -quit)"
          springboard_client="$(find .theos/_ -type f -name VCAMSpringBoardClient.dylib -print -quit)"
          worker="$(find .theos/_ -type f -name vcamd -print -quit)"
          test -n "$media_client"
          test -n "$springboard_client"
          test -n "$worker"
          lipo -info "$media_client"
          lipo -info "$springboard_client"
          lipo -info "$worker"
          lipo "$media_client" -verify_arch arm64 arm64e
          lipo "$springboard_client" -verify_arch arm64 arm64e
          lipo "$worker" -verify_arch arm64
          obsolete_count="$(find .theos/_ -type f \( -name VCAM.dylib -o -name VCAMAppClient.dylib -o -name VCAMWebKitClient.dylib \) -print | wc -l | tr -d ' ')"
          test "$obsolete_count" -eq 0
      - uses: actions/upload-artifact@v4
        with:
          name: vcam-rootless
          path: packages/*.deb
          retention-days: 7

name: Build rootless package

on:
  workflow_dispatch:
  push:
    branches: ["codex/ios16-media-bridge"]
  pull_request:

jobs:
  rootless:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run host regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Install Theos
        env:
          THEOS: ${{ runner.temp }}/theos-rootless
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          brew untap aws/tap || true
          brew install ldid xz
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          for attempt in 1 2 3 4; do
            if "$THEOS/bin/install-sdk" latest; then
              break
            fi
            if [[ "$attempt" == 4 ]]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done
      - name: Build rootless package
        env:
          THEOS: ${{ runner.temp }}/theos-rootless
        run: |
          ./scripts/build-ffmpeg-ios.sh
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
      - name: Validate rootless release shape
        run: |
          set -euo pipefail
          deb_count="$(find packages -maxdepth 1 -type f -name '*.deb' -print | wc -l | tr -d ' ')"
          test "$deb_count" -eq 1
          deb="$(find packages -maxdepth 1 -type f -name '*.deb' -print)"
          [[ "$deb" == *"_iphoneos-arm64.deb" ]]
          test -f .theos/_/Library/MobileSubstrate/DynamicLibraries/VCAMMediaServerClient.dylib
          test -f .theos/_/Library/MobileSubstrate/DynamicLibraries/VCAMSpringBoardClient.dylib
          test -x .theos/_/usr/libexec/vcamd
          lipo -verify_arch arm64 arm64e .theos/_/Library/MobileSubstrate/DynamicLibraries/VCAMMediaServerClient.dylib
          lipo -verify_arch arm64 arm64e .theos/_/Library/MobileSubstrate/DynamicLibraries/VCAMSpringBoardClient.dylib
          lipo -verify_arch arm64 .theos/_/usr/libexec/vcamd
          test ! -e .theos/_/Library/MobileSubstrate/DynamicLibraries/VCAM.dylib
          test ! -e .theos/_/Library/MobileSubstrate/DynamicLibraries/VCAMAppClient.dylib
          test ! -e .theos/_/Library/MobileSubstrate/DynamicLibraries/VCAMWebKitClient.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: vcam-rootless
          path: packages/*.deb
          retention-days: 7
